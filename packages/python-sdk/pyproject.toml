[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sorolens"
version = "0.1.0"
description = "Official Python client for the Sorolens Soroban indexing API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sorolens" }]
keywords = ["stellar", "soroban", "sorolens", "blockchain", "indexer", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "attrs>=23.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/sorolens/sorolens"
Documentation = "https://sorolens.readthedocs.io/"
Repository = "https://github.com/sorolens/sorolens"
Issues = "https://github.com/sorolens/sorolens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sorolens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "mkdocs.yml", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The generated layer is checked in verbatim; do not lint it.
"src/sorolens/_generated/**" = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# The generated layer is checked in verbatim; never reformat it.
exclude = ["src/sorolens/_generated/**"]
