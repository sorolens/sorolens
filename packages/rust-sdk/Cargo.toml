[package]
name = "sorolens-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for the Sorolens API: Soroban contract events, invocations, storage, stats, and watchdog alerts."
license = "Apache-2.0"
repository = "https://github.com/sorolens/sorolens"
homepage = "https://sorolens-web-iota.vercel.app"
documentation = "https://docs.rs/sorolens-sdk"
readme = "README.md"
keywords = ["soroban", "stellar", "smart-contracts", "observability", "sdk"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["async"]
async = ["dep:reqwest"]
blocking = ["dep:reqwest", "reqwest/blocking"]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
