# Prometheus configuration for the local `observability` compose profile.
#
# The API (PORT=8080, GET /metrics) and the indexer (INDEXER_METRICS_ADDR=:9100)
# run on the host via `make api` / the indexer binary, so they are scraped
# through host.docker.internal (see the extra_hosts entry in docker-compose.yml).
# Prometheus and Grafana scrape each other so the stack has healthy targets
# even before the application is running.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: sorolens-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana exposes /metrics without authentication.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: sorolens-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          component: api

  - job_name: sorolens-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          component: indexer
