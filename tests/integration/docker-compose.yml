version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sorolens_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  mock-rpc:
    build: ./mock_rpc
    ports:
      - "8000:8000"
  api:
    build: ../../apps/api
    environment:
      DATABASE_URL: postgres://postgres:test@postgres:5432/sorolens_test
      REDIS_URL: redis://redis:6379
      RPC_URL: http://mock-rpc:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
