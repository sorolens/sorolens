# railway.toml – one-click Railway deployment for the Sorolens API.
#
# Railway docs: https://docs.railway.com/reference/config-as-code
#
# Required environment variables (set in Railway's Variables panel):
#   DATABASE_URL       – Railway-provisioned Postgres public URL
#   REDIS_URL          – Railway-provisioned Redis URL
#   STELLAR_NETWORK    – testnet | mainnet | futurenet
#   SOROBAN_RPC_URL    – Soroban JSON-RPC endpoint
#   WATCHDOG_CONTRACT_ID – deployed watchdog contract address
#   CORS_ALLOWED_ORIGINS – comma-separated Vercel domain(s),
#                          e.g. https://sorolens-web-iota.vercel.app

[build]
# Build the Docker image using the Dockerfile in apps/api/.
dockerfilePath = "apps/api/Dockerfile"
# Build context must be the monorepo root so the Dockerfile COPY commands
# can reach apps/api/internal/db/migrations and the Go source tree.
buildContextPath = "."

[deploy]
# Railway injects $PORT; the binary already honours it.
startCommand = "/usr/local/bin/sorolens-api"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
