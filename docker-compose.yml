# Local development stack for Sorolens.
#
#   docker compose up -d      # start Postgres 16 + Redis and apply the schema
#   docker compose down       # stop everything (the data volumes are kept)
#   docker compose down -v    # ...and delete the data volumes too
#
# The Postgres and Redis settings below match the defaults in .env.example, so
# the Go API connects to them without editing any environment variables:
#
#   DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   DIRECT_DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   REDIS_URL=redis://localhost:6379
#
# Run `make api` to start the API with exactly those values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sorolens
      POSTGRES_USER: sorolens
      POSTGRES_PASSWORD: sorolens
    # WAL archiving keeps local Postgres shaped like the environment the
    # backup/restore scripts (scripts/backup.sh, scripts/restore.sh) expect.
    # CI installs scripts/aws-mock.sh as `aws` inside this container so the
    # archive_command below succeeds there; locally it only logs a failure and
    # Postgres keeps serving.
    command:
      [
        "postgres",
        "-c",
        "wal_level=replica",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_command=aws s3 cp %p s3://sorolens-backups/wal/%f",
      ]
    ports:
      - "5432:5432"
    volumes:
      - sorolens_postgres_data:/var/lib/postgresql/data
      - ./scripts/aws-mock.sh:/usr/local/bin/aws
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorolens -d sorolens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sorolens_redis_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO provides an S3-compatible endpoint so the cold-storage tier
  # (issue #146) can be exercised locally and in integration tests.
  # Enable it with `docker compose --profile archive up -d minio`.
  # Console: http://localhost:9001 (sorolens / sorolens123)
  # Create the bucket once with:
  #   docker compose exec minio mc mb --ignore-existing local/sorolens-archive
  minio:
    profiles: [archive]
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sorolens
      MINIO_ROOT_PASSWORD: sorolens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sorolens_minio_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job that applies the SQL schema on first start, so a fresh clone is
  # usable right after `docker compose up -d`. It applies the migrations exactly
  # the way CI does (.github/workflows/ci.yml): every *.up.sql, in sorted order,
  # via psql. The directory is now a single contiguous sequence (issue #516), so
  # golang-migrate (`make migrate-up`) can also read it; psql is kept here
  # because databases created by this path have no schema_migrations bookkeeping
  # (baseline one once with `make migrate-force` before switching it to
  # golang-migrate).
  #
  # Stop on the first SQL error so incomplete schemas are never treated as
  # successfully migrated.
  #
  # It shares the Postgres network namespace and connects over localhost, so it
  # does not depend on service-name DNS or on inter-container networking being
  # permitted.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    environment:
      PGPASSWORD: sorolens
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - ./apps/api/internal/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if psql -h localhost -U sorolens -d sorolens -tAc "SELECT to_regclass('public.contracts')" | grep -q contracts; then
          echo "schema already present; skipping migrations"
          exit 0
        fi
        for f in $$(ls /migrations/*.up.sql | sort); do
          echo "applying $$f"
          psql -q -v ON_ERROR_STOP=1 -h localhost -U sorolens -d sorolens -f "$$f"
        done
        echo "migrations applied"
    restart: "no"

  # Small web UI for browsing the local database at http://localhost:8081.
  adminer:
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - sorolens_net

  api:
    profiles: [full]
    image: sorolens/api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args: &buildinfo
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-dev}
    environment:
      DATABASE_URL: postgres://sorolens:sorolens@postgres:5432/sorolens?sslmode=disable
      DIRECT_DATABASE_URL: postgres://sorolens:sorolens@postgres:5432/sorolens?sslmode=disable
      REDIS_URL: redis://redis:6379
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8080}:8080"
    networks: [sorolens_net]

  indexer:
    profiles: [full]
    image: sorolens/indexer:local
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
      args: *buildinfo
    environment:
      DATABASE_URL: postgres://sorolens:sorolens@postgres:5432/sorolens?sslmode=disable
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [sorolens_net]

  web:
    profiles: [full]
    image: sorolens/web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      API_URL: http://api:8080
      INDEXER_METRICS_URL: http://indexer:9100/metrics
      PUSH_INTERNAL_SECRET: ${PUSH_INTERNAL_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@sorolens.dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COMPOSE_WEB_PORT:-3000}:3000"
    networks: [sorolens_net]

volumes:
  sorolens_postgres_data:
  sorolens_minio_data:
  sorolens_redis_data:

networks:
  sorolens_net:
    name: sorolens_net
