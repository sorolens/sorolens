# Local development stack for Sorolens.
#
#   docker compose up -d      # start Postgres 16 + Redis and apply the schema
#   docker compose down       # stop everything (the data volumes are kept)
#   docker compose down -v    # ...and delete the data volumes too
#
# The Postgres and Redis settings below match the defaults in .env.example, so
# the Go API connects to them without editing any environment variables:
#
#   DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   DIRECT_DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   REDIS_URL=redis://localhost:6379
#
# Run `make api` to start the API with exactly those values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sorolens
      POSTGRES_USER: sorolens
      POSTGRES_PASSWORD: sorolens
    # WAL archiving keeps local Postgres shaped like the environment the
    # backup/restore scripts (scripts/backup.sh, scripts/restore.sh) expect.
    # CI installs scripts/aws-mock.sh as `aws` inside this container so the
    # archive_command below succeeds there; locally it only logs a failure and
    # Postgres keeps serving.
    command:
      [
        "postgres",
        "-c",
        "wal_level=replica",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_command=aws s3 cp %p s3://sorolens-backups/wal/%f",
      ]
    ports:
      - "5432:5432"
    volumes:
      - sorolens_postgres_data:/var/lib/postgresql/data
      - ./scripts/aws-mock.sh:/usr/local/bin/aws
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorolens -d sorolens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sorolens_redis_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO provides an S3-compatible endpoint so the cold-storage tier
  # (issue #146) can be exercised locally and in integration tests.
  # Console: http://localhost:9001 (sorolens / sorolens123)
  # Create the bucket once with:
  #   docker compose exec minio mc mb --ignore-existing local/sorolens-archive
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sorolens
      MINIO_ROOT_PASSWORD: sorolens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sorolens_minio_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job that applies the SQL schema on first start, so a fresh clone is
  # usable right after `docker compose up -d`. It applies the migrations exactly
  # the way CI does (.github/workflows/ci.yml): every *.up.sql, in sorted order,
  # via psql. The directory is now a single contiguous sequence (issue #516), so
  # golang-migrate (`make migrate-up`) can also read it; psql is kept here
  # because databases created by this path have no schema_migrations bookkeeping
  # (baseline one once with `make migrate-force` before switching it to
  # golang-migrate).
  #
  # Stop on the first SQL error so incomplete schemas are never treated as
  # successfully migrated.
  #
  # It shares the Postgres network namespace and connects over localhost, so it
  # does not depend on service-name DNS or on inter-container networking being
  # permitted.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    environment:
      PGPASSWORD: sorolens
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - ./apps/api/internal/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if psql -h localhost -U sorolens -d sorolens -tAc "SELECT to_regclass('public.contracts')" | grep -q contracts; then
          echo "schema already present; skipping migrations"
          exit 0
        fi
        for f in $$(ls /migrations/*.up.sql | sort); do
          echo "applying $$f"
          psql -q -v ON_ERROR_STOP=1 -h localhost -U sorolens -d sorolens -f "$$f"
        done
        echo "migrations applied"
    restart: "no"

  # Small web UI for browsing the local database at http://localhost:8081.
  adminer:
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - sorolens_net

  # ---------------------------------------------------------------------------
  # Observability profile (issue #843): Prometheus + Grafana with the committed
  # dashboards and alert rules provisioned. See docs/observability.md.
  #
  #   docker compose --profile observability up -d
  #   ./scripts/observability-smoke.sh
  #
  # Prometheus scrapes the API (/metrics, PORT=8080) and the indexer
  # (INDEXER_METRICS_ADDR=:9100) on the host through host.docker.internal, so
  # start them with `make api` and the indexer to populate the dashboard.
  # ---------------------------------------------------------------------------

  # Generates the Grafana admin password once into a shared volume so the stack
  # never runs with a default credential. Set GRAFANA_ADMIN_PASSWORD to choose
  # it yourself; otherwise a random one is written to the volume and can be read
  # with `docker compose exec grafana cat /etc/grafana-secrets/admin-password`.
  grafana-secrets:
    profiles: ["observability"]
    image: alpine:3.21
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - sorolens_grafana_secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -s /secrets/admin-password ]; then
          echo "grafana admin password already generated; keeping it"
          exit 0
        fi
        if [ -n "$$GRAFANA_ADMIN_PASSWORD" ]; then
          printf '%s' "$$GRAFANA_ADMIN_PASSWORD" > /secrets/admin-password
        else
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /secrets/admin-password
        fi
        chmod 0444 /secrets/admin-password
        echo "grafana admin password written to the sorolens_grafana_secrets volume"
    restart: "no"
    networks:
      - sorolens_net

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - sorolens_prometheus_data:/prometheus
    # host.docker.internal lets Prometheus reach the API and indexer running on
    # the host (Docker Desktop provides it; this adds it on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    depends_on:
      grafana-secrets:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana-secrets/admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    # 3001 on the host: 3000 belongs to the Next.js dev server.
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sorolens_grafana_secrets:/etc/grafana-secrets:ro
      - sorolens_grafana_data:/var/lib/grafana
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sorolens_postgres_data:
  sorolens_minio_data:
  sorolens_redis_data:
  sorolens_prometheus_data:
  sorolens_grafana_data:
  sorolens_grafana_secrets:

networks:
  sorolens_net:
    name: sorolens_net
