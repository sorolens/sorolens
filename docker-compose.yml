# Local development stack for Sorolens.
#
#   docker compose up -d      # start Postgres 16 + Redis and apply the schema
#   docker compose down       # stop everything (the data volumes are kept)
#   docker compose down -v    # ...and delete the data volumes too
#
# The Postgres and Redis settings below match the defaults in .env.example, so
# the Go API connects to them without editing any environment variables:
#
#   DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   DIRECT_DATABASE_URL=postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
#   REDIS_URL=redis://localhost:6379
#
# Run `make api` to start the API with exactly those values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sorolens
      POSTGRES_USER: sorolens
      POSTGRES_PASSWORD: sorolens
    # WAL archiving keeps local Postgres shaped like the environment the
    # backup/restore scripts (scripts/backup.sh, scripts/restore.sh) expect.
    # CI installs scripts/aws-mock.sh as `aws` inside this container so the
    # archive_command below succeeds there; locally it only logs a failure and
    # Postgres keeps serving.
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=aws s3 cp %p s3://sorolens-backups/wal/%f"]
    ports:
      - "5432:5432"
    volumes:
      - sorolens_postgres_data:/var/lib/postgresql/data
      - ./scripts/aws-mock.sh:/usr/local/bin/aws
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorolens -d sorolens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sorolens_redis_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO provides an S3-compatible endpoint so the cold-storage tier
  # (issue #146) can be exercised locally and in integration tests.
  # Console: http://localhost:9001 (sorolens / sorolens123)
  # Create the bucket once with:
  #   docker compose exec minio mc mb --ignore-existing local/sorolens-archive
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sorolens
      MINIO_ROOT_PASSWORD: sorolens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sorolens_minio_data:/data
    networks:
      - sorolens_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job that applies the SQL schema on first start, so a fresh clone is
  # usable right after `docker compose up -d`. It applies the migrations exactly
  # the way CI does (.github/workflows/ci.yml): every *.up.sql, in sorted order,
  # via psql. golang-migrate (`make migrate-up`) cannot read this directory until
  # the duplicate migration versions (e.g. 000002_contract_versions and
  # 000002_watchdog) are renumbered, so psql is used here instead.
  #
  # Like CI, psql is run without ON_ERROR_STOP so that one failing statement does
  # not stop the remaining migrations; 000003_partition_events logs a pre-existing
  # "idx_events_contract_ledger already exists" error that CI's migration step
  # logs as well and that does not affect the resulting schema.
  #
  # It shares the Postgres network namespace and connects over localhost, so it
  # does not depend on service-name DNS or on inter-container networking being
  # permitted.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    environment:
      PGPASSWORD: sorolens
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - ./apps/api/internal/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if psql -h localhost -U sorolens -d sorolens -tAc "SELECT to_regclass('public.contracts')" | grep -q contracts; then
          echo "schema already present; skipping migrations"
          exit 0
        fi
        for f in $$(ls /migrations/*.up.sql | sort); do
          echo "applying $$f"
          psql -q -h localhost -U sorolens -d sorolens -f "$$f"
        done
        echo "migrations applied"
    restart: "no"

  # Small web UI for browsing the local database at http://localhost:8081.
  adminer:
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - sorolens_net

volumes:
  sorolens_postgres_data:
  sorolens_minio_data:
  sorolens_redis_data:

networks:
  sorolens_net:
    name: sorolens_net
