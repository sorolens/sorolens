name: Bug report
description: Something is not working correctly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill in as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "When I call GET /api/v1/contracts/:id/events with a cursor, the response always returns the same first page."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Track contract CDLZFC3S... on testnet
        2. GET /api/v1/contracts/CDLZFC3S.../events?limit=10
        3. Take the returned cursor value
        4. GET /api/v1/contracts/CDLZFC3S.../events?cursor=<value>&limit=10
        5. The response is identical to step 2
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "The second request should return the next page of events, not the same page."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or unexpected output.
      placeholder: "Both requests return the same 10 events. The cursor value in both responses is also identical."
    validations:
      required: true
  - type: input
    id: contract_id
    attributes:
      label: Contract ID (if applicable)
      description: The Soroban contract ID you were working with when the bug occurred.
      placeholder: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
    validations:
      required: false
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which network were you using?
      options:
        - testnet
        - mainnet
        - futurenet
        - local (docker compose)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please include relevant version information.
        For Go issues: `go version` and module path.
        For dashboard issues: browser and OS.
        For CLI issues: `sorolens version`.
      placeholder: |
        - Go: 1.23.1
        - Sorolens version: 0.1.2
        - OS: Ubuntu 24.04
        - Browser (if dashboard): Chrome 126
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, curl commands, or anything else that might help.
    validations:
      required: false
