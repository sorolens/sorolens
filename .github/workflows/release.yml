name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: sorolens-api
            dockerfile: apps/api/Dockerfile
            context: .
            build-args: true
          - image-name: sorolens-indexer
            dockerfile: services/indexer/Dockerfile
            context: .
            build-args: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

  release:
    name: GitHub Release & Checksums
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Checksums
        id: checksums
        run: |
          mkdir -p artifacts
          echo "# Checksums for ${{ github.ref_name }}" > artifacts/checksums.txt
          echo "# Generated on $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/checksums.txt
          echo "" >> artifacts/checksums.txt
          echo "## Published Container Images" >> artifacts/checksums.txt
          echo "ghcr.io/${{ github.repository_owner }}/sorolens-api:${{ github.ref_name }}" >> artifacts/checksums.txt
          echo "ghcr.io/${{ github.repository_owner }}/sorolens-indexer:${{ github.ref_name }}" >> artifacts/checksums.txt
          echo "" >> artifacts/checksums.txt
          echo "## Source Archive Checksums" >> artifacts/checksums.txt
          git archive --format=tar.gz --prefix=sorolens-${{ github.ref_name }}/ -o "artifacts/sorolens-${{ github.ref_name }}.tar.gz" HEAD
          git archive --format=zip --prefix=sorolens-${{ github.ref_name }}/ -o "artifacts/sorolens-${{ github.ref_name }}.zip" HEAD
          (cd artifacts && sha256sum sorolens-${{ github.ref_name }}.tar.gz sorolens-${{ github.ref_name }}.zip >> checksums.txt)

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/checksums.txt
            artifacts/sorolens-${{ github.ref_name }}.tar.gz
            artifacts/sorolens-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
