name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/python-sdk/**"
      - "docs/openapi.yaml"
      - ".github/workflows/python-sdk.yml"
    tags:
      - "python-sdk-v*"
  pull_request:
    paths:
      - "packages/python-sdk/**"
      - "docs/openapi.yaml"
      - ".github/workflows/python-sdk.yml"

jobs:
  test:
    name: Test Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest

  generated-client:
    name: Generated client up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate client from docs/openapi.yaml
        run: bash packages/python-sdk/scripts/generate_client.sh
      - name: Verify no diff
        run: git diff --exit-code -- packages/python-sdk/src/sorolens/_generated

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, generated-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: packages/python-sdk/dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python-sdk-v')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sorolens
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
