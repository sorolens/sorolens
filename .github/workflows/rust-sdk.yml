name: Rust SDK

on:
  push:
    branches: [main]
    tags: ["rust-sdk-v*"]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------
  # Rust: packages/rust-sdk (async + blocking transports)
  # ------------------------------------------------------------
  rust-sdk:
    name: Rust SDK (packages/rust-sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/rust-sdk/target/
          key: cargo-rust-sdk-${{ hashFiles('packages/rust-sdk/Cargo.lock') }}
          restore-keys: |
            cargo-rust-sdk-
      - name: cargo fmt --check
        working-directory: packages/rust-sdk
        run: cargo fmt --check
      - name: cargo build --all-features
        working-directory: packages/rust-sdk
        run: cargo build --all-features
      - name: cargo test --all-features
        working-directory: packages/rust-sdk
        run: cargo test --all-features
      - name: cargo test --doc
        working-directory: packages/rust-sdk
        run: cargo test --doc

  # ------------------------------------------------------------
  # Publish sorolens-sdk to crates.io when a rust-sdk-v* tag is pushed.
  # Requires a CARGO_REGISTRY_TOKEN repository secret.
  # ------------------------------------------------------------
  publish:
    name: Publish sorolens-sdk to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rust-sdk-v')
    needs: rust-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        working-directory: packages/rust-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
