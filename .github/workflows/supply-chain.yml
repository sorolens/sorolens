name: Supply chain

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan every committed Go module
        shell: bash
        run: |
          status=0
          while IFS= read -r manifest; do
            module=$(dirname "$manifest")
            echo "::group::$module"
            if [[ "$module" == tests/integration/mock_rpc ]]; then
              (cd "$module" && GOWORK=off govulncheck ./...) || status=1
            else
              (cd "$module" && govulncheck ./...) || status=1
            fi
            echo "::endgroup::"
          done < <(git ls-files -- '*/go.mod')
          exit "$status"

  rust:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Scan every committed Cargo lockfile
        shell: bash
        run: |
          status=0
          while IFS= read -r lockfile; do
            cargo audit --file "$lockfile" || status=1
          done < <(git ls-files -- '*/Cargo.lock')
          exit "$status"

  python:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit packages/python-sdk

  node:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - name: Audit locked workspace production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Audit locked Pulumi production dependencies
        if: ${{ !cancelled() }}
        working-directory: deploy/pulumi
        run: pnpm audit --prod --audit-level high
      - name: Audit locked Discord bot production dependencies
        if: ${{ !cancelled() }}
        working-directory: services/discord-bot
        run: npm audit --omit=dev --audit-level high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks on the checked-out branch history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --gitleaks-ignore-path .gitleaksignore --log-opts="HEAD" .
