name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------
  # Go: API, indexer, CLI
  # ------------------------------------------------------------
  go:
    name: Go (${{ matrix.module }}) - ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
        module:
          - apps/api
          - services/indexer
          - cli
          - packages/go-client
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sorolens
          POSTGRES_USER: sorolens
          POSTGRES_PASSWORD: sorolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorolens -d sorolens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.go-version }}-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            go-${{ matrix.go-version }}-${{ matrix.module }}-
            go-${{ matrix.go-version }}-
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: --timeout=10m
      - name: Run DB migrations
        if: matrix.module == 'apps/api'
        env:
          PGPASSWORD: sorolens
        run: |
          for f in $(ls apps/api/internal/db/migrations/*.up.sql | sort); do
            psql -h localhost -U sorolens -d sorolens -f "$f"
          done
      - name: go test
        working-directory: ${{ matrix.module }}
        env:
          POSTGRES_TEST_URL: postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable
        run: go test -race -timeout 120s -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}

  # ------------------------------------------------------------
  # Go client regeneration (issue #149): fail if the checked-in generated
  # code under packages/go-client is out of date with docs/openapi.yaml.
  # ------------------------------------------------------------
  go-client-stale:
    name: Go client up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
      - name: Regenerate client
        working-directory: packages/go-client
        run: oapi-codegen --config oapi-codegen.yaml ../../docs/openapi.yaml
      - name: Verify no diff
        run: git diff --exit-code -- packages/go-client/internal

  # ------------------------------------------------------------
  # Node: XDR decoder package and shared packages
  # ------------------------------------------------------------
  node:
    name: Node (packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-node22-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-node22-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm --filter "./packages/**" lint

  # ------------------------------------------------------------
  # Next.js dashboard build
  # ------------------------------------------------------------
  next-build:
    name: Next.js build
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-node22-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-node22-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build dashboard
        working-directory: apps/web
        env:
          # Provide a placeholder so Next.js does not fail on missing env vars
          # at build time. Real values are set in Vercel project settings.
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: pnpm build

  # ------------------------------------------------------------
  # Rust: fixture contract
  # ------------------------------------------------------------
  rust:
    name: Rust (contracts/counter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/counter/target/
          key: cargo-${{ hashFiles('contracts/counter/Cargo.lock') }}
          restore-keys: |
            cargo-
      - name: cargo fmt --check
        working-directory: contracts/counter
        run: cargo fmt --check
      - name: cargo check (native)
        working-directory: contracts/counter
        run: cargo check
      - name: cargo check (wasm32)
        working-directory: contracts/counter
        run: cargo check --target wasm32v1-none
      - name: cargo test
        working-directory: contracts/counter
        run: cargo test

  # ------------------------------------------------------------
  # Backup & Restore Scripts Test
  # ------------------------------------------------------------
  backup-test:
    name: Backup and Restore Scripts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sorolens
          POSTGRES_USER: sorolens
          POSTGRES_PASSWORD: sorolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorolens -d sorolens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Postgres for archive_mode
        env:
          PGPASSWORD: sorolens
        run: |
          psql -h localhost -U sorolens -d sorolens -c "ALTER SYSTEM SET wal_level = replica;"
          psql -h localhost -U sorolens -d sorolens -c "ALTER SYSTEM SET archive_mode = on;"
          psql -h localhost -U sorolens -d sorolens -c "ALTER SYSTEM SET archive_command = 'aws s3 cp %p s3://sorolens-backups/wal/%f';"
          # Restart postgres to pick up archive_mode
          docker exec $(docker ps -qf ancestor=postgres:16-alpine) pg_ctl restart -D /var/lib/postgresql/data -m fast
      - name: Wait for Postgres
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -U sorolens -d sorolens; do sleep 1; done
      - name: Setup Mock S3 Bucket
        run: |
          mkdir -p /tmp/s3/sorolens-backups/logical /tmp/s3/sorolens-backups/base /tmp/s3/sorolens-backups/wal
          install -m 755 scripts/aws-mock.sh /usr/local/bin/aws
      - name: Run Backup Script
        run: |
          ./scripts/backup.sh
      - name: Run Restore Script
        run: |
          LATEST_BASE=$(ls /tmp/s3/sorolens-backups/base/base_*.tar.gz | head -n 1)
          LATEST_BASE_S3="s3://${LATEST_BASE/\/tmp\/s3\//}"
          ./scripts/restore.sh "$LATEST_BASE_S3" "2026-09-23 13:00:00"