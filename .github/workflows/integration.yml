name: Integration Tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: mock RPC -> indexer -> Postgres -> API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Run integration suite
        working-directory: tests/integration
        run: make integration-test

      - name: Set up Python for fuzzer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Run OpenAPI contract fuzzing
        run: |
          chmod +x ./tests/fuzz/run_fuzzer.sh
          ./tests/fuzz/run_fuzzer.sh

      - name: Publish OpenAPI contract fuzzing report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-fuzz-report
          path: tests/fuzz/reports/
