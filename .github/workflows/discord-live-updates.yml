name: Discord live-updates

# Posts an "Issue Resolved" embed to Discord's #live-updates whenever a PR is
# merged that closes at least one issue. Runs on every PR merge; skips
# quietly if the PR does not close an issue.

on:
  pull_request:
    types: [closed]

jobs:
  announce:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract closed issues
        id: closed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '') + ' ' + pr.title;
            // Match: Closes #123, Fixes #123, Resolves #123, close #123, etc.
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const nums = [...new Set([...body.matchAll(re)].map(m => m[1]))];
            core.setOutput('numbers', nums.join(','));
            core.setOutput('has_closed', nums.length > 0 ? 'true' : 'false');

      - name: Fetch each closed issue
        if: steps.closed.outputs.has_closed == 'true'
        id: enrich
        uses: actions/github-script@v7
        with:
          script: |
            const nums = '${{ steps.closed.outputs.numbers }}'.split(',');
            const items = [];
            for (const n of nums) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: parseInt(n, 10),
              });
              // Grab the tier label if present (trivial | medium | high).
              const tierLabel = (issue.labels || [])
                .map(l => (typeof l === 'string' ? l : l.name))
                .find(name => ['trivial', 'medium', 'high'].includes(name));
              const pts = { trivial: 100, medium: 150, high: 200 }[tierLabel] || null;
              items.push({
                number: issue.number,
                title:  issue.title,
                url:    issue.html_url,
                tier:   tierLabel || 'unlabelled',
                points: pts,
              });
            }
            core.setOutput('items_json', JSON.stringify(items));

      - name: Post to Discord
        if: steps.closed.outputs.has_closed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_UPDATES_WEBHOOK }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_NUMBER:   ${{ github.event.pull_request.number }}
          PR_AUTHOR:   ${{ github.event.pull_request.user.login }}
          PR_AVATAR:   ${{ github.event.pull_request.user.avatar_url }}
          ITEMS_JSON:  ${{ steps.enrich.outputs.items_json }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "DISCORD_LIVE_UPDATES_WEBHOOK secret missing; skipping."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request

          items  = json.loads(os.environ["ITEMS_JSON"])
          author = os.environ["PR_AUTHOR"]
          pr_url = os.environ["PR_URL"]
          pr_no  = os.environ["PR_NUMBER"]
          pr_ti  = os.environ["PR_TITLE"]
          avatar = os.environ["PR_AVATAR"]

          total_pts = sum((it.get("points") or 0) for it in items)

          def format_item(it):
              n     = it["number"]
              url   = it["url"]
              title = it["title"]
              tier  = it["tier"]
              pts   = it.get("points")
              pts_suffix = " - {}pts".format(pts) if pts else ""
              return "• [#{}]({}) - {} ({}{})".format(n, url, title, tier, pts_suffix)

          issue_lines = [format_item(it) for it in items]

          embed = {
              "title": "✅ Issue Resolved!" if len(items) == 1 else f"✅ {len(items)} Issues Resolved!",
              "url":   pr_url,
              "description": (
                  f"**[{author}](https://github.com/{author})** merged "
                  f"[#{pr_no}]({pr_url}): {pr_ti}\n\n"
                  + "\n".join(issue_lines)
                  + (f"\n\n**Total: {total_pts} points**" if total_pts else "")
              ),
              "color": 0x06B6D4,  # Sorolens teal
              "author": {
                  "name":     author,
                  "url":      f"https://github.com/{author}",
                  "icon_url": avatar,
              },
              "footer": {"text": "sorolens/sorolens"},
          }
          payload = {"username": "Sorolens", "embeds": [embed]}
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  # Discord's Cloudflare filter 403s the default Python-urllib UA.
                  "User-Agent": "sorolens-live-updates-bot (github.com/sorolens/sorolens, 1.0)",
              },
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("discord:", r.status)
          except urllib.error.HTTPError as e:
              print("discord error:", e.code, e.reason)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
