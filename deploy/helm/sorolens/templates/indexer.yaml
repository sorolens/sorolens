{{- $values := .Values.indexer }}
{{- $sharded := eq $values.mode "sharded" }}
{{- /*
  One Deployment per indexer role. "single" runs one process owning every
  shard, which keeps its shard state in memory and so must never run twice:
  replicas 1 and the Recreate strategy, so an upgrade stops the old pod
  before starting the new one. "sharded" runs one coordinator and a pool of
  workers that coordinate through a Postgres shard store.
*/}}
{{- $roles := list (dict "component" "indexer" "role" "all" "replicas" 1) }}
{{- if $sharded }}
{{- $roles = list (dict "component" "indexer-coordinator" "role" "coordinator" "replicas" 1) (dict "component" "indexer-worker" "role" "worker" "replicas" $values.sharding.workers.replicas) }}
{{- end }}
{{- range $i, $r := $roles }}
{{- $name := include "sorolens.componentName" (dict "root" $ "component" $r.component) }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sorolens.componentLabels" (dict "root" $ "component" $r.component) | nindent 4 }}
spec:
  replicas: {{ $r.replicas }}
  {{- if ne $r.role "worker" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "sorolens.selectorLabels" (dict "root" $ "component" $r.component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sorolens.componentLabels" (dict "root" $ "component" $r.component) | nindent 8 }}
      {{- $annotations := include "sorolens.checksumAnnotations" $ | trim }}
      {{- if or $annotations $values.podAnnotations }}
      annotations:
        {{- with $annotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sorolens.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: indexer
          image: {{ include "sorolens.image" (dict "root" $ "image" $values.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          args:
            - -mode=continuous
            - -poll-interval={{ $values.pollInterval }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ $values.metricsPort }}
              protocol: TCP
          env:
            - name: INDEXER_ROLE
              value: {{ $r.role | quote }}
            - name: INDEXER_METRICS_ADDR
              value: {{ printf ":%v" $values.metricsPort | quote }}
            {{- if $sharded }}
            - name: INDEXER_SHARD_STORE
              value: postgres
            - name: INDEXER_SHARD_COUNT
              value: {{ $values.sharding.shardCount | quote }}
            # Each worker claims shards under its own pod name.
            - name: INDEXER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            - name: STELLAR_NETWORK
              value: {{ $.Values.config.stellarNetwork | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.config.logLevel | quote }}
            - name: WATCHDOG_ENABLED
              value: {{ ternary "true" "false" (ne $.Values.config.watchdogContractId "") | quote }}
            {{- with $.Values.config.watchdogContractId }}
            - name: WATCHDOG_CONTRACT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- include "sorolens.perNetworkRpcEnv" $ | nindent 12 }}
            {{- include "sorolens.connectionEnv" $ | nindent 12 }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml $values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and (eq $r.role "worker") $values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sorolens.componentLabels" (dict "root" $ "component" $r.component) | nindent 4 }}
spec:
  maxUnavailable: {{ $values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "sorolens.selectorLabels" (dict "root" $ "component" $r.component) | nindent 6 }}
{{- end }}
{{- end }}
