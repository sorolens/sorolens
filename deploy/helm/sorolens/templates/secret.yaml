{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "set database.url and database.redisUrl, or database.existingSecret naming a Secret that holds them" }}
{{- end }}
{{- if not .Values.database.redisUrl }}
{{- fail "set database.redisUrl, or database.existingSecret naming a Secret that holds it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorolens.secretName" . }}
  labels:
    {{- include "sorolens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.databaseUrl }}: {{ .Values.database.url | quote }}
  {{ .Values.database.secretKeys.redisUrl }}: {{ .Values.database.redisUrl | quote }}
  {{ .Values.database.secretKeys.directDatabaseUrl }}: {{ default .Values.database.url .Values.database.directUrl | quote }}
{{- end }}
