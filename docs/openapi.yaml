      operationId: v2LiveActivity
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/V2Minutes"
      responses:
        "200":
          description: Active contracts, hottest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ActivityResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/events/recent:
    get:
      tags: [API v2]
      summary: Newest events across every tracked contract
      operationId: v2RecentEvents
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/V2Limit"
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2EventList"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/contracts:
    get:
      tags: [API v2]
      summary: List tracked contracts
      operationId: v2ListContracts
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/V2Cursor"
        - $ref: "#/components/parameters/V2Limit"
        - $ref: "#/components/parameters/V2Network"
        - $ref: "#/components/parameters/V2Status"
      responses:
        "200":
          description: Page of contracts
