        - name: fn
          in: query
          required: false
          schema:
            type: string
          description: Function name filter.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [SUCCESS, FAILED, NOT_FOUND]
          description: Invocation status filter.
        - $ref: "#/components/parameters/NetworkParam"
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Lower ledger bound (inclusive).
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Upper ledger bound (inclusive).
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on ledger_closed_at (RFC 3339).
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on ledger_closed_at (RFC 3339).
      responses:
        "200":
