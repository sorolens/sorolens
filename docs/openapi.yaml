      type: object
      required:
        [
          contract_id,
          month,
          uptime_pct,
          total_checks,
          healthy_checks,
          incidents,
          mttr_seconds,
          total_downtime_seconds,
          longest_outage_seconds,
          ongoing_outage,
          critical_alerts,
          warning_alerts,
          info_alerts,
          total_alerts,
          first_check,
          last_check,
        ]
      properties:
        contract_id:
          type: string
        month:
          type: string
          description: Reporting period, YYYY-MM (UTC).
        uptime_pct:
          type: number
          format: double
          description: healthy_checks / total_checks * 100; 0 when there were no checks.
        total_checks:
          type: integer
          format: int64
        healthy_checks:
          type: integer
          format: int64
        incidents:
          type: integer
          format: int64
          description: Outages (a transition from Healthy into any other status) in the month.
        mttr_seconds:
          type: number
          format: double
          description: Mean time to recovery across incidents that recovered within the month.
        total_downtime_seconds:
          type: number
          format: double
        longest_outage_seconds:
          type: number
          format: double
        ongoing_outage:
          type: boolean
          description: True when the month ends mid-incident (MTTR then understates reality).
        critical_alerts:
          type: integer
          format: int64
        warning_alerts:
          type: integer
          format: int64
        info_alerts:
          type: integer
          format: int64
        total_alerts:
          type: integer
          format: int64
        first_check:
