        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/contracts/{id}/health:
    get:
      tags: [Watchdog]
      summary: List health checks for a monitored contract
      operationId: listContractHealthChecks
      security:
        - ApiKeyAuth: [read:watchdog]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum checks to return (default 100).
      responses:
        "200":
          description: Health checks
          content:
            application/json:
              schema:
                type: object
                required: [health_checks]
                properties:
                  health_checks:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthCheck"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/contracts/{id}/alerts:
    get:
      tags: [Watchdog]
      summary: List alerts for a monitored contract
      operationId: listContractAlerts
      security:
        - ApiKeyAuth: [read:watchdog]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [Info, Warning, Critical]
        - $ref: "#/components/parameters/NetworkParam"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/AlertCursor"
      responses:
        "200":
          description: Alerts for the contract
          content:
            application/json:
              schema:
                type: object
                required: [alerts, next_cursor]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractAlert"
                  next_cursor:
                    type: string
                    description: Cursor for the next (older) page; empty when no more pages.
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/contracts/{id}/uptime:
    get:
      tags: [Watchdog]
      summary: Get uptime percentage for a monitored contract
      operationId: getContractUptime
      security:
        - ApiKeyAuth: [read:watchdog]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
          description: Time window for uptime calculation (default 24h).
      responses:
        "200":
          description: Uptime result
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, window, uptime_pct]
                properties:
                  contract_id:
                    type: string
                  window:
                    type: string
                  uptime_pct:
                    type: number
                    format: double
                    description: Percentage of checks with Healthy status (0–100).
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/subscriptions:
    get:
      tags: [Notifications]
      summary: List alert notification subscriptions
      operationId: listAlertSubscriptions
      description: Integration secrets are never returned; see AlertSubscription.
      security:
        - ApiKeyAuth: [read:watchdog]
          RoleAuth: [contributor]
      responses:
        "200":
          description: Subscriptions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Notifications]
      summary: Subscribe a channel to a contract's alerts
      operationId: createAlertSubscription
      description: |
        Critical alerts for the contract are delivered to the channel in its
        native format: `webhook` (generic JSON), `slack` (Block Kit via an
        incoming webhook), `discord` (embed via a channel webhook) or
        `pagerduty` (Events API v2 trigger with severity mapping).
      security:
        - ApiKeyAuth: [write:contracts]
          RoleAuth: [contributor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertSubscription"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/subscriptions/{id}:
    delete:
      tags: [Notifications]
      summary: Delete an alert subscription
      operationId: deleteAlertSubscription
      security:
        - ApiKeyAuth: [write:contracts]
          RoleAuth: [contributor]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "Scoped API key. Send as `Authorization: Bearer <token>` (or `X-API-Key`)."
    RoleAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        Role-based auth. Resolve a user identity from one of
        X-User-ID, X-GitHub-Login, X-User-Sub, or X-GitHub-ID and enforce the
        minimum role declared next to this security scheme.
    IdentityHeaderAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: Watchlist endpoints read the user ID from X-User-ID.

  parameters:
    ContractID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Contract ID (starts with C).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, clamped to 200).
    NetworkParam:
      name: network
      in: query
      required: false
      schema:
        type: string
        enum: [testnet, mainnet, futurenet, standalone]
      description: Network filter; empty means all networks.
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
      description: Caller user ID.

    AlertCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque alert cursor from a previous page's next_cursor.

  headers:
    XCache:
      description: |
        Response cache status (`HIT` or `MISS`). Present when the API runs
        with Redis caching enabled; cached bodies live for API_CACHE_TTL
        (default 30s) and are purged by writes to the same resource.
      schema:
        type: string
        enum: [HIT, MISS]

  responses:
    Unauthorized:
      description: Missing or invalid credential or identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenScope:
      description: Valid credential but missing required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScopeError"
    ForbiddenRole:
      description: Identity present but role below the required minimum
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid query or body input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Global per-IP rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [NOT_FOUND, INVALID_INPUT, INTERNAL, RATE_LIMITED, UNSUPPORTED_MEDIA_TYPE]
                message:
                  type: string
                request_id:
                  type: string
            - type: object
              properties:
                error:
                  type: string

    ScopeError:
      type: object
      required: [error, required]
      properties:
        error:
          type: string
        required:
          type: string

    RoleError:
      type: object
      required: [error, required, role]
      properties:
        error:
          type: string
        required:
          type: string
        role:
          type: string

    Contract:
      type: object
      required: [id, network, label, wasm_hash, created_at_ledger, backfill_complete_at, status, added_at]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
        wasm_hash:
          type: string
        created_at_ledger:
          type: integer
          format: int64
        backfill_complete_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, active, backfilling, error, paused]
        added_at:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - id
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - tx_hash
        - type
        - topic_xdr
        - value_xdr
        - topic_decoded
        - value_decoded
        - in_successful_call
      properties:
        id:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        tx_hash:
          type: string
        type:
          type: string
        topic_xdr:
          type: array
          items:
            type: string
        value_xdr:
          type: string
        topic_decoded:
          type: array
          items: {}
        value_decoded: {}
        in_successful_call:
          type: boolean

    Invocation:
      type: object
      required:
        - tx_hash
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - status
        - function_name
        - args_decoded
        - result_decoded
        - result_xdr
        - resource_fee_charged
        - cpu_insn
        - mem_byte
        - ledger_read_byte
        - ledger_write_byte
        - application_order
      properties:
        tx_hash:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        status:
          type: string
        function_name:
          type: string
        args_decoded:
          type: object
          additionalProperties: true
        result_decoded: {}
        result_xdr:
          type: string
        resource_fee_charged:
          type: integer
          format: int64
        cpu_insn:
          type: integer
          format: int64
        mem_byte:
          type: integer
          format: int64
        ledger_read_byte:
          type: integer
          format: int64
        ledger_write_byte:
          type: integer
          format: int64
        application_order:
          type: integer

    StorageEntry:
      type: object
      required: [contract_id, network, key_xdr, value_xdr, durability, live_until_ledger, last_modified_ledger, status, last_seen_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        key_xdr:
          type: string
        key_decoded: {}
        value_xdr:
          type: string
        value_decoded: {}
        durability:
          type: string
        live_until_ledger:
          type: integer
          format: int64
        last_modified_ledger:
          type: integer
          format: int64
        status:
          type: string
        last_seen_at:
          type: string
          format: date-time

    ContractStats:
      type: object
      required:
        - event_count
        - invocation_count
        - storage_count
        - last_synced_ledger
        - window_event_count
        - window_invocation_count
        - window_duration
      properties:
        event_count:
          type: integer
          format: int64
        invocation_count:
          type: integer
          format: int64
        storage_count:
          type: integer
          format: int64
        last_synced_ledger:
          type: integer
          format: int32
        window_event_count:
          type: integer
          format: int64
        window_invocation_count:
          type: integer
          format: int64
        window_duration:
          type: string

    ForecastPoint:
      type: object
      required: [date, value, lower, upper]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
        lower:
          type: number
          format: double
        upper:
          type: number
          format: double

    ForecastSeries:
      type: object
      required: [metric, horizon, daily_count, points]
      properties:
        metric:
          type: string
          enum: [fees, invocations, events]
        horizon:
          type: integer
        daily_count:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"

    ContractSnapshot:
      type: object
      required: [contract_id, network, ledger, first_tracked_ledger, storage, last_event]
      properties:
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        first_tracked_ledger:
          type: integer
          format: int32
        storage:
          type: array
          items:
            $ref: "#/components/schemas/StorageEntry"
        last_event:
          description: The last event at or before the ledger, or null if none.
          allOf:
            - $ref: "#/components/schemas/Event"
          nullable: true
          type: object

    APIKey:
      type: object
      required: [id, name, key_prefix, scopes, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"

    WatchlistItem:
      type: object
      required: [contract_id, added_at]
      properties:
        contract_id:
          type: string
        added_at:
          type: string
          format: date-time

    InWatchlist:
      type: object
      required: [in_watchlist]
      properties:
        in_watchlist:
          type: boolean

    WatchdogStats:
      type: object
      required: [total_monitored, healthy, degraded, unresponsive, total_alerts, critical_alerts]
      properties:
        total_monitored:
          type: integer
          format: int64
        healthy:
          type: integer
          format: int64
        degraded:
          type: integer
          format: int64
        unresponsive:
          type: integer
          format: int64
        total_alerts:
          type: integer
          format: int64
        critical_alerts:
          type: integer
          format: int64

    ContractAlert:
      type: object
      required: [contract_id, severity, message, ledger, tx_hash, timestamp]
      properties:
        contract_id:
          type: string
        severity:
          type: string
          enum: [Info, Warning, Critical]
        message:
          type: string
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
        timestamp:
          type: string
          format: date-time

    UptimeResult:
      type: object
      required: [contract_id, window, uptime_pct]
      properties:
        contract_id:
          type: string
          description: The contract ID this uptime figure applies to.
        window:
          type: string
          enum: [24h, 7d, 30d]
          description: The time window over which uptime was computed.
        uptime_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            Uptime percentage with up to two decimal places.
            Computed as healthy_checks / total_checks × 100.
            Returns 0 when no health checks were recorded in the window.

    MonitoredContract:
      type: object
      required: [contract_id, network, name, owner, status, last_check, check_interval, registered_at, updated_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
        name:
          type: string
        owner:
          type: string
        status:
          type: string
        last_check:
          type: string
          format: date-time
          nullable: true
        check_interval:
          type: integer
          format: int64
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HealthCheck:
      type: object
      required: [contract_id, status, metadata, ledger, tx_hash, timestamp]
      properties:
        contract_id:
          type: string
        status:
          type: string
        metadata:
          type: string
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
        timestamp:
          type: string
          format: date-time

    ContractUpgrade:
      type: object
      required: [contract_id, from_hash, to_hash, ledger, at]
      properties:
        contract_id:
          type: string
        from_hash:
          type: string
          description: Previous Wasm hash (hex).
        to_hash:
          type: string
          description: New Wasm hash (hex).
        ledger:
          type: integer
          format: int64
        tx_hash:
          type: string
        at:
          type: string
          format: date-time

    HealthScore:
      type: object
      required: [contract_id, score, components, computed_at]
      properties:
        contract_id:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        components:
          type: object
          required: [uptime, error_rate, performance, storage_ttl]
          properties:
            uptime:
              type: integer
            error_rate:
              type: integer
            performance:
              type: integer
            storage_ttl:
              type: integer
        computed_at:
          type: string
          format: date-time

    ContractSummary:
      type: object
      required: [contract_id, network, label, status, generated_at, stats]
      properties:
        contract_id:
          type: string
        network:
          type: string
        label:
          type: string
        status:
          type: string
        generated_at:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/ContractStats"
        latest_event:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Event"
        latest_invocation:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Invocation"
        health_score:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthScore"

    ContractGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          nullable: true
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        edges:
          type: array
          nullable: true
          items:
            type: object
            required: [source, target, count]
            properties:
              source:
                type: string
              target:
                type: string
              count:
                type: integer

    CompareResponse:
      type: object
      required: [window, contracts]
      properties:
        window:
          type: string
          enum: [24h, 7d, 30d]
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/CompareContractEntry"

    CompareContractEntry:
      type: object
      required: [id, network, label, status, tracked, has_data, event_count, invocation_count, avg_cpu, avg_fee, last_synced_ledger, event_volume]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
        status:
          type: string
        tracked:
          type: boolean
        has_data:
          type: boolean
        event_count:
          type: integer
          format: int64
        invocation_count:
          type: integer
          format: int64
        avg_cpu:
          type: number
        avg_fee:
          type: number
        health_score:
          type: integer
          nullable: true
        last_synced_ledger:
          type: integer
          format: int64
        event_volume:
          type: array
          items:
            type: object
            required: [timestamp, count]
            properties:
              timestamp:
                type: string
                format: date-time
              count:
                type: integer
                format: int64
        error:
          type: string

    AlertSubscription:
      type: object
      description: |
        A notification channel subscribed to a contract's alerts. Secrets are
        never returned: Slack and Discord webhook URLs are masked
        (e.g. `https://hooks.slack.com/services/***`) and the PagerDuty
        routing key is reported only via `has_routing_key`.
      required: [id, contract_id, channel_type, webhook_url, has_routing_key, severity_filter, created_at, updated_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        channel_type:
          type: string
          enum: [webhook, slack, discord, pagerduty]
        webhook_url:
          type: string
        has_routing_key:
          type: boolean
        severity_filter:
          type: string
          enum: [Info, Warning, Critical]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAlertSubscription:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
        channel_type:
          type: string
          enum: [webhook, slack, discord, pagerduty]
          default: webhook
        webhook_url:
          type: string
          format: uri
          description: |
            Required for webhook (http or https), slack and discord (https
            incoming webhook URL). Optional for pagerduty, where it defaults
            to https://events.pagerduty.com/v2/enqueue.
        routing_key:
          type: string
          description: PagerDuty integration key. Required for pagerduty, rejected otherwise.
        severity_filter:
          type: string
          enum: [Info, Warning, Critical]
          default: Critical

    SlackMessage:
      type: object
      required: [response_type, text]
      properties:
        response_type:
          type: string
          enum: [ephemeral]
        text:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
