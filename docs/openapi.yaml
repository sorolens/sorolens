    ContractSummary:
      type: object
      required: [contract_id, network, label, status, generated_at, stats]
      properties:
        contract_id:
          type: string
        network:
          type: string
        label:
          type: string
        status:
          type: string
        generated_at:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/ContractStats"
        latest_event:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Event"
        latest_invocation:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Invocation"
        health_score:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthScore"

    ContractGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          nullable: true
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        edges:
          type: array
          nullable: true
          items:
            type: object
            required: [source, target, count]
            properties:
              source:
                type: string
              target:
                type: string
              count:
                type: integer

    ContractSpec:
      type: object
      required: [contract_id, parsed_at, spec]
      properties:
        contract_id:
          type: string
        wasm_hash:
          type: string
        parsed_at:
          type: string
          format: date-time
        spec:
          $ref: "#/components/schemas/ContractSpecTree"

    ContractSpecTree:
      type: object
      required: [functions]
      properties:
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ContractSpecFunction"

    ContractSpecFunction:
      type: object
      required: [name, inputs, outputs]
      properties:
        name:
          type: string
        doc:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/ContractSpecInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ContractSpecType"

    ContractSpecInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        doc:
          type: string
        type:
          $ref: "#/components/schemas/ContractSpecType"

    # A node in the argument/return type tree. `kind` is a scalar ("address",
    # "u32", "i128", "string", …), a composite ("vec", "option", "map",
    # "result", "tuple", "bytes_n"), or "udt" for a user-defined reference.
    ContractSpecType:
      type: object
      required: [kind]
      additionalProperties: true
      properties:
        kind:
          type: string
        name:
          type: string
        elem:
          $ref: "#/components/schemas/ContractSpecType"
        key:
          $ref: "#/components/schemas/ContractSpecType"
        value:
          $ref: "#/components/schemas/ContractSpecType"
        ok:
          $ref: "#/components/schemas/ContractSpecType"
        err:
          $ref: "#/components/schemas/ContractSpecType"
        tuple:
          type: array
          items:
            $ref: "#/components/schemas/ContractSpecType"
        n:
          type: integer

    CompareResponse:
      type: object
      required: [window, contracts]
      properties:
        window:
          type: string
          enum: [24h, 7d, 30d]
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/CompareContractEntry"

    CompareContractEntry:
      type: object
      required: [id, network, label, status, tracked, has_data, event_count, invocation_count, avg_cpu, avg_fee, last_synced_ledger, event_volume]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
        status:
          type: string
        tracked:
          type: boolean
        has_data:
          type: boolean
        event_count:
          type: integer
          format: int64
        invocation_count:
          type: integer
          format: int64
        avg_cpu:
          type: number
        avg_fee:
          type: number
        health_score:
          type: integer
          nullable: true
        last_synced_ledger:
          type: integer
          format: int64
        event_volume:
          type: array
          items:
            type: object
            required: [timestamp, count]
            properties:
              timestamp:
                type: string
                format: date-time
              count:
                type: integer
                format: int64
        error:
          type: string

    AlertSubscription:
      type: object
      description: |
        A notification channel subscribed to a contract's alerts. Secrets are
        never returned: Slack and Discord webhook URLs are masked
        (e.g. `https://hooks.slack.com/services/***`) and the PagerDuty
        routing key is reported only via `has_routing_key`.
      required: [id, contract_id, channel_type, webhook_url, has_routing_key, severity_filter, created_at, updated_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        channel_type:
          type: string
          enum: [webhook, slack, discord, pagerduty]
        webhook_url:
          type: string
        has_routing_key:
          type: boolean
        severity_filter:
          type: string
          enum: [Info, Warning, Critical]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAlertSubscription:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
        channel_type:
          type: string
          enum: [webhook, slack, discord, pagerduty]
          default: webhook
        webhook_url:
          type: string
          format: uri
          description: |
            Required for webhook (http or https), slack and discord (https
            incoming webhook URL). Optional for pagerduty, where it defaults
            to https://events.pagerduty.com/v2/enqueue.
        routing_key:
          type: string
          description: PagerDuty integration key. Required for pagerduty, rejected otherwise.
        severity_filter:
          type: string
          enum: [Info, Warning, Critical]
          default: Critical

    SlackMessage:
      type: object
      required: [response_type, text]
      properties:
        response_type:
          type: string
          enum: [ephemeral]
        text:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true

    ContractVerificationRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/VerificationSourceInput"
        artifact:
          type: string
          description: |
            Built `.wasm` path relative to the crate directory, bypassing
            artifact discovery in multi-artifact workspaces.
        expected:
          $ref: "#/components/schemas/VerificationExpectedInput"

    VerificationSourceInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [archive, git]
          description: |
            `archive` requires `content_base64`; `git` requires `url` and
            `commit`.
        filename:
          type: string
          description: Archive name, used in the build log. Archive sources only.
        content_base64:
          type: string
          description: |
            Standard-base64 encoded `.tar.gz` of the contract source. Archive
            sources only. The decoded payload is capped at 8 MiB.
        url:
          type: string
          format: uri
          description: HTTPS Git URL to clone. Git sources only.
        commit:
          type: string
          description: Commit, tag, or branch to check out. Git sources only.
        subdir:
          type: string
          description: |
            Crate directory inside the materialized source, for archives or
            repositories holding more than one crate.

    VerificationExpectedInput:
      type: object
      properties:
        stellar_version:
          type: string
          description: |
            Stellar CLI version the contract was originally built with. A
            mismatch is reported as a diagnostic rather than a hard failure.
        rustc_version:
          type: string
          description: rustc version the contract was originally built with.

    ContractVerification:
      type: object
      required: [contract_id, status, matched, source, toolchain, diagnostics, submitted_at, updated_at]
      properties:
        contract_id:
          type: string
        status:
          type: string
          enum: [verified, failed]
          description: |
            `verified` when the recompiled hash matches the on-chain hash,
            `failed` otherwise. Diagnostics explain a failure.
        matched:
          type: boolean
        on_chain_hash:
          type: string
          description: Wasm hash recorded on-chain for the contract (hex).
        compiled_wasm_hash:
          type: string
          description: SHA-256 hash produced by the rebuild (hex).
        source:
          $ref: "#/components/schemas/VerificationSource"
        toolchain:
          $ref: "#/components/schemas/VerificationToolchain"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDiagnostic"
        build_log:
          type: string
          description: Captured build output, truncated when very large.
        submitted_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VerificationSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [archive, git]
        ref:
          type: string
          description: Archive filename or resolved Git commit.
        digest:
          type: string
          description: SHA-256 digest of the submitted source.

    VerificationToolchain:
      type: object
      properties:
        stellar:
          type: string
        rustc:
          type: string
        cargo:
          type: string

    VerificationDiagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string
        hint:
          type: string
          description: Actionable suggestion for resolving the finding.
