  /api/v1/contracts/{id}/snapshot.json:
    get:
      tags: [Snapshots]
      summary: Portable JSON export of a contract's current state
      operationId: exportContractSnapshot
      description: |
        Returns the contract's current state as a single versioned JSON
        document: metadata, storage, recent events, and summary. The shape is
        frozen by `schema_version` and is deterministic for an unchanged store
        (stable field order, sorted collections, no wall-clock fields), so
        exports can be archived or diffed. When the client advertises
        `Accept-Encoding: gzip` the body is gzip-compressed.
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: Versioned contract snapshot export
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="<contract_id>-snapshot.json"
            Content-Encoding:
              schema:
                type: string
              description: gzip when the client advertises Accept-Encoding gzip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshotExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/upgrades:
    get:
      tags: [Contracts]
      summary: List Wasm code upgrades for a contract
      operationId: listContractUpgrades
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Upgrades, newest first
          content:
            application/json:
              schema:
                type: object
                required: [upgrades]
                properties:
                  upgrades:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractUpgrade"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/health-score:
    get:
      tags: [Stats]
      summary: Get a contract's composite 0-100 health score
      operationId: getContractHealthScore
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: The cached health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthScore"
        "404":
          description: Contract not found, or its score has not been computed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/summary:
    get:
      tags: [Stats]
      summary: Get a contract's dashboard summary
      operationId: getContractSummary
      description: Contract metadata, stats, latest event and invocation, and health score in one call.
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/graph:
    get:
      tags: [Contracts]
      summary: Get the contract's cross-contract call graph
      operationId: getContractGraph
      description: Nodes and edges derived from the contract's most recent invocations (up to 1000).
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: The call graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractGraph"
        "400":
          description: Invalid contract ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/spec:
    get:
      tags: [Contracts]
      summary: Get a contract's parsed SEP-48 interface spec
      operationId: getContractSpec
      description: >
        The interface spec extracted from the contract's `contractspecv0` Wasm
        custom section: every callable function with its argument and return
        type tree. Returns 404 both for an untracked contract and for a tracked
        contract whose spec has not been parsed yet.
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: The cached interface spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSpec"
        "404":
          description: Contract not found, or its interface spec has not been parsed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/contracts/{id}/wasm:
    get:
      tags: [Contracts]
      summary: Download the contract's cached Wasm binary
      operationId: getContractWasm
      description: |
        Returns the exact on-chain Wasm bytes for the contract. The indexer
        caches the binary on the first CONTRACT_CODE entry it sees, so the
        payload is content-addressed by Wasm hash and safe to serve
        immutably (issue #162).
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: The raw Wasm binary.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Wasm-Hash:
              schema:
                type: string
          content:
            application/wasm:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown contract, or its Wasm has not been fetched yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stream/events:
    get:
      tags: [Events]
      summary: Stream new events (Server-Sent Events)
      operationId: streamAllEvents
      security:
        - ApiKeyAuth: [read:contracts]
      parameters:
        - name: contract_id
          in: query
          required: false
          schema:
            type: string
          description: Only stream events for this contract.
      responses:
        "200":
          description: An SSE stream; each `data:` line is a JSON Event.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/contracts/{id}/uptime:
    get:
      tags: [Watchdog]
      summary: Get uptime percentage for a monitored contract
      operationId: getContractUptime
      security:
        - ApiKeyAuth: [read:watchdog]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
          description: Time window over which to compute uptime (default 24h).
      responses:
        "200":
          description: Uptime statistics for the specified window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeResult"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/subscriptions:
    get:
      tags: [Notifications]
      summary: List alert notification subscriptions
      operationId: listAlertSubscriptions
      description: Integration secrets are never returned; see AlertSubscription.
      security:
        - ApiKeyAuth: [read:watchdog]
          RoleAuth: [contributor]
      responses:
        "200":
          description: Subscriptions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Notifications]
      summary: Subscribe a channel to a contract's alerts
      operationId: createAlertSubscription
      description: |
        Critical alerts for the contract are delivered to the channel in its
        native format: `webhook` (generic JSON), `slack` (Block Kit via an
        incoming webhook), `discord` (embed via a channel webhook) or
        `pagerduty` (Events API v2 trigger with severity mapping).
      security:
        - ApiKeyAuth: [write:contracts]
          RoleAuth: [contributor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertSubscription"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/watchdog/subscriptions/{id}:
    delete:
      tags: [Notifications]
      summary: Delete an alert subscription
      operationId: deleteAlertSubscription
      security:
        - ApiKeyAuth: [write:contracts]
          RoleAuth: [contributor]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenRole"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List deduplicated alert groups
      description: |
        Returns the grouped, deduplicated alert view by default (one row per
        group, ordered by last_seen descending). Pass `flat=true` to get the
        raw per-event alert feed instead.
      operationId: listAlerts
      parameters:
        - name: flat
          in: query
          required: false
          schema:
            type: boolean
          description: Return the raw ContractAlert feed instead of grouped alerts.
        - name: contract_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by contract ID.
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [Info, Warning, Critical]
          description: Severity filter.
        - $ref: "#/components/parameters/NetworkParam"
        - $ref: "#/components/parameters/AlertCursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum results to return (default 100).
      responses:
        "200":
          description: Alert groups (or raw alerts when flat=true)
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertGroup"
                    description: Present when flat is not set.
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractAlert"
                    description: Present when flat=true.
                  next_cursor:
                    type: string
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/reports/{contract_id}:
    get:
      tags: [Reports]
      summary: Get a contract's monthly SLA report
      description: |
        Returns the monthly SLA/uptime report for a contract, derived from
        stored watchdog health checks and alerts. Supports JSON (default),
        CSV, and PDF export formats.
      operationId: getContractReport
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
          description: Contract ID (starts with C).
        - name: month
          in: query
          required: false
          schema:
            type: string
          description: Reporting month as YYYY-MM (UTC). Defaults to the current month.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, pdf]
          description: Export format (default json).
      responses:
        "200":
          description: The monthly SLA report
          headers:
            X-Report-Signature:
              description: Hex HMAC-SHA256 signature over the canonical report text; present only when signed.
              schema:
                type: string
            X-Report-Signed:
              description: "\"true\" when REPORT_SIGNING_KEY is configured, \"false\" otherwise."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractReport"
            text/csv: {}
            application/pdf: {}
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: SLA reporting not supported by this deployment's store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/reports/{contract_id}/history:
    get:
      tags: [Reports]
      summary: Get a contract's SLA history across months
      operationId: getContractReportHistory
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
          description: Contract ID (starts with C).
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
          description: Number of trailing months to include (default 12).
      responses:
        "200":
          description: Monthly SLA history
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, months]
                properties:
                  contract_id:
                    type: string
                  months:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonthlySLA"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: SLA reporting not supported by this deployment's store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/reports/{contract_id}/badge.svg:
    get:
      tags: [Reports]
      summary: Get an SLA badge SVG for a contract
      description: |
        Shields.io-style SVG badge showing a month's uptime, suitable for
        embedding in a README.
      operationId: getContractSLABadge
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
          description: Contract ID (starts with C).
        - name: month
          in: query
          required: false
          schema:
            type: string
          description: Reporting month as YYYY-MM (UTC). Defaults to the current month.
      responses:
        "200":
          description: SVG badge
          content:
            image/svg+xml: {}
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: SLA reporting not supported by this deployment's store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "Scoped API key. Send as `Authorization: Bearer <token>` (or `X-API-Key`)."
    RoleAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        Role-based auth. Resolve a user identity from one of
        X-User-ID, X-GitHub-Login, X-User-Sub, or X-GitHub-ID and enforce the
        minimum role declared next to this security scheme.
    IdentityHeaderAuth:
      type: apiKey
      in: header
      name: X-User-ID
      description: Watchlist endpoints read the user ID from X-User-ID.

  parameters:
    ContractID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Contract ID (starts with C).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, clamped to 200).
    NetworkParam:
      name: network
      in: query
      required: false
      schema:
        type: string
        enum: [testnet, mainnet, futurenet, standalone]
      description: Network filter; empty means all networks.
    TagParam:
      name: tag
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: "^[a-z0-9][a-z0-9_-]*$"
      description: Show only contracts carrying this tag.
    TagPath:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: "^[a-z0-9][a-z0-9_-]*$"
      description: Tag to remove.
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
      description: Caller user ID.
    WatchlistContractID:
      name: contractId
      in: path
      required: true
      schema:
        type: string
      description: Contract ID in the watchlist path.
    V2Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor taken from `pagination.next_cursor`.
    V2Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, clamped to 200).
    V2Network:
      name: network
      in: query
      required: false
      schema:
        type: string
        enum: [testnet, mainnet, futurenet, standalone]
      description: Network filter; omitted or `all` means every network.
    V2Status:
      name: status
      in: query
      required: false
      schema:
        type: string
      description: Status filter, e.g. `active`.
    V2Minutes:
      name: minutes
      in: query
      required: false
      schema:
        type: integer
        default: 30
        maximum: 1440
      description: Window size in one-minute buckets.

    AlertCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque alert cursor from a previous page's next_cursor.


  headers:
    XCache:
      description: |
        Response cache status (`HIT` or `MISS`). Present when the API runs
        with Redis caching enabled; cached bodies live for API_CACHE_TTL
        (default 30s) and are purged by writes to the same resource.
      schema:
        type: string
        enum: [HIT, MISS]


  responses:
    Unauthorized:
      description: Missing or invalid credential or identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenScope:
      description: Valid credential but missing required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScopeError"
    ForbiddenRole:
      description: Identity present but role below the required minimum
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid query or body input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Global per-IP rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [NOT_FOUND, INVALID_INPUT, INTERNAL, RATE_LIMITED, UNSUPPORTED_MEDIA_TYPE]
                message:
                  type: string
                request_id:
                  type: string
            - type: object
              properties:
                error:
                  type: string

    ScopeError:
      type: object
      required: [error, required]
      properties:
        error:
          type: string
        required:
          type: string

    RoleError:
      type: object
      required: [error, required, role]
      properties:
        error:
          type: string
        required:
          type: string
        role:
          type: string

    Contract:
      type: object
      required: [id, network, label, wasm_hash, created_at_ledger, backfill_complete_at, status, added_at, tags]
      properties:
        id:
          type: string
        network:
          type: string
        label:
          type: string
        wasm_hash:
          type: string
        created_at_ledger:
          type: integer
          format: int64
        backfill_complete_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, active, backfilling, error, paused]
        added_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
          description: User-defined tags, sorted ascending. Always present; empty when the contract has no tags.

    ContractTagRequest:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: Tag label. Trimmed and lowercased before storage.

    ContractTags:
      type: object
      required: [contract_id, tags]
      properties:
        contract_id:
          type: string
        tags:
          type: array
          items:
            type: string

    BatchContractsRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: "^C[A-Za-z0-9]{55}$"
          description: Contract IDs to act on (at most 100; duplicates are ignored).
        action:
          type: string
          enum: [untrack, tag]
          description: >-
            untrack permanently deletes the contracts and their indexed data;
            tag sets the label on each contract.
        args:
          type: object
          properties:
            label:
              type: string
              description: Required when action is `tag`; replaces the contract label.

    BatchContractsResult:
      type: object
      required: [action, requested, affected]
      properties:
        action:
          type: string
          enum: [untrack, tag]
        requested:
          type: integer
          description: Number of distinct contract IDs in the request.
        affected:
          type: integer
          format: int64
          description: Number of contracts actually changed (unknown IDs are ignored).

    Event:
      type: object
      required:
        - id
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - tx_hash
        - type
        - topic_xdr
        - value_xdr
        - topic_decoded
        - value_decoded
        - in_successful_call
      properties:
        id:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        tx_hash:
          type: string
        type:
          type: string
        topic_xdr:
          type: array
          items:
            type: string
        value_xdr:
          type: string
        topic_decoded:
          type: array
          items: {}
        value_decoded: {}
        in_successful_call:
          type: boolean

    Invocation:
      type: object
      required:
        - tx_hash
        - contract_id
        - network
        - ledger
        - ledger_closed_at
        - status
        - function_name
        - args_decoded
        - result_decoded
        - result_xdr
        - resource_fee_charged
        - cpu_insn
        - mem_byte
        - ledger_read_byte
        - ledger_write_byte
        - application_order
      properties:
        tx_hash:
          type: string
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
        ledger_closed_at:
          type: string
          format: date-time
        status:
          type: string
        function_name:
          type: string
        args_decoded:
          type: object
          additionalProperties: true
        result_decoded: {}
        result_xdr:
          type: string
        resource_fee_charged:
          type: integer
          format: int64
        cpu_insn:
          type: integer
          format: int64
        mem_byte:
          type: integer
          format: int64
        ledger_read_byte:
          type: integer
          format: int64
        ledger_write_byte:
          type: integer
          format: int64
        application_order:
          type: integer

    StorageEntry:
      type: object
      required: [contract_id, network, key_xdr, value_xdr, durability, live_until_ledger, last_modified_ledger, status, last_seen_at]
      properties:
        contract_id:
          type: string
        network:
          type: string
