          enum: [24h, 7d, 30d]
          description: The time window over which uptime was computed.
        uptime_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            Uptime percentage with up to two decimal places.
            Computed as healthy_checks / total_checks × 100.
            Returns 0 when no health checks were recorded in the window.

