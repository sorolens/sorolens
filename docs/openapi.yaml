  # ----------------------------------------------------------------------------
  # API v2 (issue #144)
  #
  # Identical paths to v1 under the /api/v2 prefix, with the consistent v2
  # contract: every list returns {data, pagination}, every timestamp is RFC
  # 3339 UTC, optional fields are explicit nulls. See docs/api-v2.md for the
  # field-by-field mapping.
  # ----------------------------------------------------------------------------
  /api/v2/stats/global:
    get:
      tags: [API v2]
      summary: Network-wide summary
      operationId: v2GlobalStats
      security:
        - ApiKeyAuth: [read:contracts]
