          type: string
          description: Semantic version injected at build time; "dev" when unset.
          example: 1.4.2
        git_sha:
          type: string
          description: Git commit SHA injected at build time; "dev" when unset.
          example: abc1234
        built_at:
          type: string
          description: RFC3339 build timestamp injected at build time; "dev" when unset or malformed.
          example: "2026-01-02T15:04:05Z"

    ContractSnapshotExport:
      type: object
      required: [schema_version, contract_id, network, ledger, metadata, storage, events, summary]
      properties:
        schema_version:
          type: integer
          description: Version of the export shape; currently 1.
        contract_id:
          type: string
        network:
          type: string
        ledger:
          type: integer
          format: int32
          description: Newest indexed ledger the export is keyed to.
        metadata:
          $ref: "#/components/schemas/Contract"
        storage:
          type: array
          description: Live storage entries, one per key, sorted by key_xdr.
          items:
            $ref: "#/components/schemas/StorageEntry"
        events:
          type: array
          description: Most recent events, newest first (up to 50).
          items:
            $ref: "#/components/schemas/Event"
        summary:
          type: object
          required: [storage_count, event_count, first_tracked_ledger]
          properties:
            storage_count:
              type: integer
            event_count:
              type: integer
            first_tracked_ledger:
              type: integer
              format: int32
            last_event_id:
              type: string
              description: Omitted when the contract has no events.
            last_event_ledger:
              type: integer
              format: int32
            storage_truncated:
              type: boolean
              description: Present and true only when storage hit the 1000-entry cap.

