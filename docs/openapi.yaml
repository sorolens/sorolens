          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [API v2]
      summary: Register a contract for tracking
      operationId: v2RegisterContract
      security:
        - ApiKeyAuth: []
        - RoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, network]
              properties:
                id:
                  type: string
                network:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: Contract accepted for backfill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Contract"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/contracts/validate:
    post:
      tags: [API v2]
      summary: Validate a contract id before tracking it
      operationId: v2ValidateContract
      security:
        - ApiKeyAuth: [read:contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id, network]
