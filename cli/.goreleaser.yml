version: 2

project_name: sorolens

builds:
  - main: ./
    binary: sorolens
    ldflags:
      - -X github.com/sorolens/sorolens/cli/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

brews:
  - name: sorolens
    homepage: https://github.com/sorolens/sorolens
    description: "CLI for the Sorolens Soroban smart contract observability platform"
    repository:
      owner: sorolens
      name: homebrew-tap
      # token not configured; set HOMEBREW_TAP_GITHUB_TOKEN in environment

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
