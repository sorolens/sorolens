version: 2

project_name: sorolens

builds:
  - main: ./
    binary: sorolens
    ldflags:
      - -X github.com/sorolens/sorolens/cli/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

homebrew_casks:
  - name: sorolens
    binaries:
      - sorolens
    homepage: https://github.com/sorolens/sorolens
    description: "CLI for the Sorolens Soroban smart contract observability platform"
    license: Apache-2.0
    repository:
      owner: sorolens
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
