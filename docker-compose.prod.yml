# Production-shaped stack for the Sorolens API: Postgres, Redis, and the
# containerised Go API. Unlike the root docker-compose.yml (local Postgres and
# Redis only, with WAL archiving), this file also runs the API and applies
# pending migrations on startup.
#
# Usage:
#   cp .env.example .env        # then edit the values below
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl http://localhost:8080/api/v1/health
#
# Every value below can be overridden from the environment or a .env file.

name: sorolens-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sorolens}
      POSTGRES_USER: ${POSTGRES_USER:-sorolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sorolens}
    volumes:
      - sorolens_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sorolens} -d ${POSTGRES_DB:-sorolens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sorolens_prod_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sorolens_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sorolens_prod_net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sorolens-api:prod
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-sorolens}:${POSTGRES_PASSWORD:-sorolens}@postgres:5432/${POSTGRES_DB:-sorolens}?sslmode=disable"
      DIRECT_DATABASE_URL: "postgres://${POSTGRES_USER:-sorolens}:${POSTGRES_PASSWORD:-sorolens}@postgres:5432/${POSTGRES_DB:-sorolens}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      WATCHDOG_CONTRACT_ID: ${WATCHDOG_CONTRACT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Browser origins allowed to call the API. Set this to the deployed
      # dashboard origin (for example https://sorolens-web-iota.vercel.app).
      # Defaults to "*" so a fresh stack is reachable from any origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sorolens_prod_net
    restart: unless-stopped

volumes:
  sorolens_prod_postgres_data:
  sorolens_prod_redis_data:

networks:
  sorolens_prod_net:
    name: sorolens_prod_net
