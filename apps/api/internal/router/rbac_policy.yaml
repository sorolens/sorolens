# RBAC authorization matrix for every API v1 route.
#
# Each entry describes one route and the expected HTTP status code for each
# caller role.  "anonymous" means no identity in context.  Codes follow the
# pattern used by RequireRole: 401 when unauthenticated on a role-gated route,
# 403 when authenticated but below the minimum role.
#
# "open" means the route has no role gate; any caller (even anonymous) can
# reach the handler.  The handler itself may still return 404 or 422 based on
# its logic — the matrix only tests the authorization layer.
#
# Fields:
#   method      HTTP method
#   pattern     chi route pattern (without /api/v1 prefix)
#   anonymous   expected status for requests with no identity
#   viewer      expected status for a user with the "viewer" role
#   contributor expected status for a user with the "contributor" role
#   admin       expected status for a user with the "admin" role
#
# Note: pattern values containing '{' and '}' are quoted to prevent YAML from
# interpreting chi parameter placeholders as inline flow maps.

routes:
  # ---- read-only, no role gate (open reads) --------------------------------
  - method: GET
    pattern: /events
    anonymous: 200
    viewer: 200
    contributor: 200
    admin: 200

  - method: GET
    pattern: /events/recent
    anonymous: 200
