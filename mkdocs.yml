# Sorolens documentation site (issue #847).
#
# Built by Read the Docs from .readthedocs.yaml; preview locally with
# `make docs-serve`. See docs/contributing/docs.md for how to edit it.
site_name: Sorolens
site_description: Real-time monitoring, alerting and on-chain health checks for Soroban smart contracts
# Read the Docs sets READTHEDOCS_CANONICAL_URL per version (latest, stable, vX.Y.Z).
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://sorolens.readthedocs.io/"]
repo_url: https://github.com/sorolens/sorolens
repo_name: sorolens/sorolens
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Broken internal links and anchors are build errors (strict: true turns these
# warnings into failures). This is the link check that runs on pull requests.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
  not_found: warn

# Files kept in docs/ that are not site pages.
exclude_docs: |
  DESIGN.md
  issue-closure-summary.md
  requirements.txt
  # GitHub-facing indexes; the site's own index.md pages replace them.
  /README.md
  /cli/README.md

# Generated by `make docs-cli`; reachable from cli/index.md, kept out of the
# nav so regenerating the command tree never needs a nav edit.
not_in_nav: |
  /cli/reference/

plugins:
  - search
  # Pulls packages/python-sdk/mkdocs.yml in as the Python SDK section, so the
  # SDK keeps one set of pages instead of a copy here.
  - monorepo
  # Renders docs/openapi.yaml into the API reference at build time
  # ([OAD(...)] in docs/api/reference.md), so the reference is never copied.
  - neoteroi.mkdocsoad:
      use_pymdownx: true
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/python-sdk/src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # GitHub-style heading anchors, so links written for GitHub (for example
  # "#4-self-hosting-with-docker--docker-compose") also work on the site.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started.md
      - Rule language: rule-language.md
      - Contract type presets: presets.md
      - Watchdog policies: watchdog-policy.md
      - Webhooks: webhooks.md
      - CI health checks (sorolens-check): sorolens-check.md
  - Self-hosting:
      - Deployment guide: deployment.md
      - Configuration reference: configuration.md
      - Kubernetes (Helm): self-hosting/kubernetes.md
      - AWS: self-hosting/aws.md
      - Indexer: indexer.md
      - Sharded indexer: indexer-sharding.md
      - Read replicas: read_replica.md
      - Hubble import: hubble-import.md
      - Verifying releases: verifying-releases.md
  - API:
      - api/index.md
      - Authentication and API keys: authentication.md
      - API v2: api-v2.md
      - GraphQL security: graphql_security.md
      - API reference: api/reference.md
  - SDKs:
      - sdks/index.md
      - Python SDK: '!include ./packages/python-sdk/mkdocs.yml'
  - CLI:
      - cli/index.md
      - Plugins: cli-plugins.md
  - Operations:
      - Runbook: runbook.md
      - Metrics: metrics.md
      - Observability stack: observability.md
      - Backups and PITR: backups.md
      - Migrations: migrations.md
      - Discord bot: discord-bot.md
  - Contributing:
      - Editing these docs: contributing/docs.md
      - Web localization: i18n.md
      - Web performance budgets: performance.md
      - Mutation testing: mutation-testing.md
